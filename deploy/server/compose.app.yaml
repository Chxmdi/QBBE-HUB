# One QBBE environment's app (docs/runbooks/hosting.md). release.sh runs it as
# project "qbbe-<environment>" with that environment's .env file, so a staging
# release never touches the production container and the reverse.

services:
  app:
    image: ${QBBE_IMAGE:?QBBE_IMAGE is required}
    container_name: qbbe-app-${QBBE_ENV:?QBBE_ENV is required}
    restart: unless-stopped
    env_file:
      - ${QBBE_APP_ENV_FILE:?QBBE_APP_ENV_FILE is required}
    environment:
      # The scanner is the shared one on this server, whatever app.env says.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_SOCKET: ""
      NODE_OPTIONS: --max-old-space-size=${QBBE_NODE_HEAP_MB:-1536}
      # Marks a deployed server: the app refuses to start when a required
      # setting is missing or belongs to another project (src/instrumentation.ts).
      QBBE_ENV: ${QBBE_ENV}
    # Ready, not just running: settings complete and the database answers the
    # service key (/api/health/ready). release.sh waits on this and restores
    # the previous release when it never turns healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 4
    # Production gets twice staging's share of the processors when both are
    # busy (a staging load test cannot starve production).
    cpu_shares: ${QBBE_CPU_SHARES:-1024}
    mem_limit: ${QBBE_MEM_LIMIT:-3g}
    # A runaway (or hostile) image cannot use up the server's process slots
    # and take the other environment down with it.
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # This environment's own networks: Caddy reaches the app on "edge", the
    # app reaches the scanner on "scan". The other environment's app is on
    # neither, so it cannot call this one except through Caddy.
    networks:
      edge:
        aliases: ["app-${QBBE_ENV}"]
      scan: {}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  edge:
    external: true
    name: qbbe-edge-${QBBE_ENV:?QBBE_ENV is required}
  scan:
    external: true
    name: qbbe-scan-${QBBE_ENV:?QBBE_ENV is required}
