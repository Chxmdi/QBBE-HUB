name: Server setup

# Prepares the QBBE server, or brings it up to date (docs/runbooks/hosting.md).
# Safe to run again. It installs Docker, automatic security updates, the host
# firewall rules for ports 80 and 443, swap, and the shared services (the
# HTTPS front door and the virus scanner). It does not touch either
# environment's app; the Deploy workflow does that.
#
# First run: tick "show the host key". The run prints the server's SSH host
# key line and changes nothing; save that line as the DEPLOY_KNOWN_HOSTS
# secret, then run this again without the tick.
#
# It runs only from the "server-admin" GitHub environment, which holds the
# server's administrator key (ADMIN_SSH_KEY) and should require a reviewer.
# The staging and production environments hold only their own deploy user's
# key, which can do nothing but release that environment
# (docs/runbooks/hosting.md, "Deploy access").

on:
  workflow_dispatch:
    inputs:
      show_host_key:
        description: Only print the server's SSH host key (first run)
        type: boolean
        default: false
      acme_email:
        description: Address Let's Encrypt writes to about certificates (defaults to the ACME_EMAIL variable)
        type: string
        required: false
        default: ""
      remove_legacy_deploy_access:
        description: Remove the old shared deploy access (only once both environments have deployed with DEPLOY_MODE=isolated)
        type: boolean
        default: false

# No permissions by default: each job names the ones it uses.
permissions: {}

concurrency:
  group: server-setup
  cancel-in-progress: false

jobs:
  # Runs from main only, and says so: without this job a run from another
  # branch would show everything skipped. A branch can edit its own copy of
  # this file, so the control that holds is the environment's "Deployment
  # branches and tags" rule (main only; hosting.md, "Deploy access").
  branch:
    permissions: {}
    name: Runs from main only
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Server setup runs from main only. Choose 'main' under 'Use workflow from' and run it again."
          exit 1

  host-key:
    permissions: {}
    name: Show the server's host key
    if: github.ref == 'refs/heads/main' && inputs.show_host_key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: server-admin
    steps:
      - name: Read the host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::Set the DEPLOY_HOST variable on the server-admin environment to the server's public IP address."; exit 1; }
          line=$(ssh-keyscan -T 20 -t ed25519 "$DEPLOY_HOST" 2>/dev/null | grep -v '^#' | head -n 1)
          [ -n "$line" ] || { echo "::error::No SSH answer from ${DEPLOY_HOST} on port 22. Check the address and that the server is running."; exit 1; }
          fingerprint=$(printf '%s\n' "$line" | ssh-keygen -lf - | awk '{print $2}')
          {
            echo "### Server host key"
            echo
            echo "Save this whole line as the **DEPLOY_KNOWN_HOSTS** secret on server-admin, staging and production:"
            echo
            echo '```'
            echo "$line"
            echo '```'
            echo
            echo "Fingerprint: \`${fingerprint}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$line"

  setup:
    permissions:
      contents: read
    name: Prepare the server
    if: github.ref == 'refs/heads/main' && !inputs.show_host_key
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: server-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/qbbe-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.ADMIN_USER || 'ubuntu' }}
          key: ${{ secrets.ADMIN_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Install and start the shared services
        env:
          # The run's address, or the server-admin variable ACME_EMAIL.
          ACME_EMAIL: ${{ inputs.acme_email || vars.ACME_EMAIL }}
          # Public keys only (variables on server-admin): each is installed
          # for its own environment's deploy user.
          STAGING_DEPLOY_PUBKEY: ${{ vars.STAGING_DEPLOY_PUBKEY }}
          PRODUCTION_DEPLOY_PUBKEY: ${{ vars.PRODUCTION_DEPLOY_PUBKEY }}
          # The new administrator key, needed by the run that removes the old
          # shared access (it replaces the administrator's keys).
          ADMIN_PUBKEY: ${{ vars.ADMIN_PUBKEY }}
          LEGACY_DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          REMOVE_LEGACY: ${{ inputs.remove_legacy_deploy_access && '1' || '0' }}
        run: |
          [[ "$ACME_EMAIL" =~ ^[^[:space:]\'\"]+@[^[:space:]\'\"]+$ ]] || { echo "::error::Set the ACME_EMAIL variable on server-admin (or give an address) for certificate notices; '${ACME_EMAIL}' is not an email address."; exit 1; }
          [[ "$LEGACY_DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::DEPLOY_USER is not a user name."; exit 1; }
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for key in "$STAGING_DEPLOY_PUBKEY" "$PRODUCTION_DEPLOY_PUBKEY" "$ADMIN_PUBKEY"; do
            [[ -z "$key" || "$key" =~ ^ssh-[a-z0-9-]+\ [A-Za-z0-9+/=]+(\ [^\'\"]*)?$ ]] || { echo "::error::A deploy public key is not one 'ssh-...' line."; exit 1; }
          done
          dir="/tmp/qbbe-setup-${GITHUB_RUN_ID}"
          ssh qbbe "mkdir -p '$dir'"
          scp -q deploy/server/setup.sh deploy/server/compose.base.yaml deploy/server/Caddyfile \
            deploy/server/compose.app.yaml deploy/server/site.caddy.template deploy/server/release.sh \
            deploy/server/qbbe-release deploy/server/qbbe-ssh-gate deploy/server/sudoers.qbbe "qbbe:${dir}/"
          ssh qbbe "sudo ACME_EMAIL='${ACME_EMAIL}' STAGING_DEPLOY_PUBKEY='${STAGING_DEPLOY_PUBKEY}' PRODUCTION_DEPLOY_PUBKEY='${PRODUCTION_DEPLOY_PUBKEY}' ADMIN_PUBKEY='${ADMIN_PUBKEY}' DEPLOY_USER='${LEGACY_DEPLOY_USER}' IMAGE_REPOSITORY='${image_repository}' REMOVE_LEGACY_DEPLOY_ACCESS='${REMOVE_LEGACY}' bash '${dir}/setup.sh' '${dir}'; status=\$?; rm -rf '${dir}'; exit \$status"
          echo "Server prepared. Next: run the Deploy workflow for staging." >> "$GITHUB_STEP_SUMMARY"
