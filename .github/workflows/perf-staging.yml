name: Performance (staging)

# The 50-user load test against the staging site (#115, #55): the same k6
# script as perf.yml, pointed at real hosting rather than one GitHub runner
# that holds the database, the API, Auth and the app together. This is the
# acceptance figure; perf.yml stays as a regression signal.
#
# It runs under the `staging` GitHub environment, so its secrets and any
# approval rule apply, and it refuses any project that is not the registered
# staging project. The fixture (50 people, 10 projects, 2,000 tasks,
# a channel with 1,000 messages) is created on staging once and kept; each run
# gives the 50 people a password of its own, which is never written down.
# `teardown` removes the fixture.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long the 50 users keep working (k6 duration, e.g. 2m)
        type: string
        required: false
        default: 2m
      expect_commit:
        description: Fail unless staging is running this workflow's commit
        type: boolean
        required: false
        default: true
      teardown:
        description: Remove the fixture from staging after the run
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      duration:
        type: string
        required: false
        default: 2m
      expect_commit:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  load:
    name: 50-user load test on staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    # One run at a time: two sets of 50 people would measure each other.
    concurrency:
      group: perf-staging
      cancel-in-progress: false
    env:
      APP_ENV: ${{ secrets.APP_ENV }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # The same registrations scripts/check-deploy-environment.sh enforces
      # for deploys: this job can only ever reach the staging project, and the
      # app settings it reads the keys from must be staging's.
      - name: Refuse anything but the registered staging project
        run: |
          for name in APP_ENV SUPABASE_PROJECT_REF STAGING_SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SITE_URL; do
            [ -n "${!name:-}" ] || { echo "::error::Missing ${name} on the staging environment."; exit 1; }
          done
          [ "$SUPABASE_PROJECT_REF" = "$STAGING_SUPABASE_PROJECT_REF" ] \
            || { echo "::error::Refusing: SUPABASE_PROJECT_REF is not the registered staging project."; exit 1; }
          echo "Staging project matches its registration."

      - name: Staging must be running this commit
        if: inputs.expect_commit
        run: |
          deployed=$(curl -s "${SITE_URL%/}/api/health/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "::error::Staging is running '${deployed:-<unknown>}', not ${GITHUB_SHA}. Deploy this commit to staging first (Deploy, environment staging), then run this again."
            exit 1
          fi
          echo "Staging is running ${GITHUB_SHA}."

      # The site's Supabase address and keys, from the same APP_ENV secret the
      # Deploy workflow writes to the server. All masked.
      - name: Read the site's Supabase address and keys
        shell: bash
        run: |
          set -uo pipefail
          get() { printf '%s\n' "$APP_ENV" | tr -d '\r' | grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" | tail -n 1 | cut -d= -f2- | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"; }
          url=$(get NEXT_PUBLIC_SUPABASE_URL)
          anon=$(get NEXT_PUBLIC_SUPABASE_ANON_KEY)
          service=$(get SUPABASE_SERVICE_ROLE_KEY)
          for pair in "NEXT_PUBLIC_SUPABASE_URL:$url" "NEXT_PUBLIC_SUPABASE_ANON_KEY:$anon" "SUPABASE_SERVICE_ROLE_KEY:$service"; do
            [ -n "${pair#*:}" ] || { echo "::error::The staging APP_ENV secret has no ${pair%%:*}."; exit 1; }
          done
          [ "${url%/}" = "https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co" ] \
            || { echo "::error::Refusing: the staging APP_ENV points at ${url}, not the registered staging project."; exit 1; }
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${url%/}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"
          echo "Staging reads ${url%/}."

      # The fixture is written over a direct database connection with the
      # environment's database password. The pooler address comes from
      # `supabase link` (which needs SUPABASE_ACCESS_TOKEN); when the token is
      # refused, the shared pooler is found by trying each region, which needs
      # only the password. The connection is checked before anything is written.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Local config's signing key
        run: scripts/local-signing-key.sh

      - name: Connect to the staging database
        shell: bash
        run: |
          set -uo pipefail
          enc=$(PW="$SUPABASE_DB_PASSWORD" python3 -c "import os,urllib.parse; print(urllib.parse.quote(os.environ['PW'], safe=''))")
          echo "::add-mask::$enc"
          url=""
          if supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" > /dev/null 2> "$RUNNER_TEMP/link-err"; then
            template=$(cat supabase/.temp/pooler-url 2>/dev/null || true)
            # Session mode (port 5432): the seeding runs in one connection.
            [ -n "$template" ] && url=$(printf '%s' "$template" | sed -e "s|\[YOUR-PASSWORD\]|${enc}|" -e 's|:6543/|:5432/|')
          else
            echo "supabase link was refused: $(tail -n 1 "$RUNNER_TEMP/link-err")"
          fi
          if [ -z "$url" ] || ! PGCONNECT_TIMEOUT=10 psql -X -q -t -A "$url" -c "select 1" > /dev/null 2>&1; then
            url=""
            echo "Looking for the project's pooler by region."
            for region in ca-central-1 us-east-1 us-east-2 us-west-1 us-west-2 eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 sa-east-1; do
              for prefix in aws-0 aws-1; do
                candidate="postgresql://postgres.${SUPABASE_PROJECT_REF}:${enc}@${prefix}-${region}.pooler.supabase.com:5432/postgres"
                if PGCONNECT_TIMEOUT=8 psql -X -q -t -A "$candidate" -c "select 1" > /dev/null 2>&1; then
                  url="$candidate"; echo "Found it: ${prefix}-${region}."; break 2
                fi
              done
            done
          fi
          [ -n "$url" ] || { echo "::error::Could not connect to the staging database through its pooler with SUPABASE_DB_PASSWORD."; exit 1; }
          echo "::add-mask::$url"
          echo "PERF_DB_URL=$url" >> "$GITHUB_ENV"
          echo "Connected to the staging database through its pooler."

      - name: Put the fixture in place and sign in the 50 people
        run: node scripts/qa/perf-staging.mjs prepare "$RUNNER_TEMP/perf-sessions.json"

      - uses: grafana/setup-k6-action@v1

      - name: 50 people for ${{ inputs.duration || '2m' }}
        run: |
          k6 run \
            -e BASE_URL="${SITE_URL%/}" \
            -e SESSIONS="$RUNNER_TEMP/perf-sessions.json" \
            -e DURATION=${{ inputs.duration || '2m' }} \
            --summary-export=perf-summary-staging.json \
            scripts/qa/perf.k6.js

      - name: Remove the fixture from staging
        if: always() && inputs.teardown
        run: node scripts/qa/perf-staging.mjs teardown

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-summary-staging
          path: perf-summary-staging.json
          retention-days: 90
