name: Rollback

# Puts an earlier image back live on one QBBE environment (#51;
# docs/runbooks/hosting.md).
#
# This restores the website only. Database migrations are append-only and
# are not reversed here: fix forward with a new migration, or follow the
# schema rollback section of docs/runbooks/release-procedure.md. The earlier
# image can run against the migrated database because destructive changes
# ship only after a release stopped using what they remove (the contract
# rule, tests/unit/migration-contract.test.ts). Undoing a migration itself
# means restoring the backup the Deploy run took right before migrating
# (linked in its summary).
#
# The commit to restore is in the Deploy run's Release summary ("Rollback
# target", the image <environment>-<commit>), and in
# /opt/qbbe/<environment>/releases.log on the server. The server keeps each
# environment's five newest images; older ones are pulled again from the
# registry. The app settings stay the environment's current ones unless
# "restore settings" is ticked: then the settings that ran with that image
# come back too (kept on the server for the five newest releases). Tick it
# when the bad deploy changed APP_ENV; do not tick it when a secret has
# since been rotated (the old settings hold the old one).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: QBBE environment to roll back
        required: true
        type: choice
        options: [staging, production]
      commit:
        description: Full commit SHA of the release to restore (from the Deploy run's Release summary)
        required: true
        type: string
      restore_settings:
        description: Also restore the app settings that ran with that release
        type: boolean
        default: false

# No permissions by default: each job names the ones it uses.
permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Runs from main only, and says so: without this job a run from another
  # branch would show everything skipped. A branch can edit its own copy of
  # this file, so the control that holds is the environment's "Deployment
  # branches and tags" rule (main only; hosting.md, "Deploy access").
  branch:
    permissions: {}
    name: Runs from main only
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Rollback runs from main only. Choose 'main' under 'Use workflow from' and run it again."
          exit 1

  rollback:
    # The server pulls the release image from ghcr.io with this run's token.
    permissions:
      contents: read
      packages: read
    name: Restore an earlier release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMMIT: ${{ inputs.commit }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the commit
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'${COMMIT}' is not a full 40-character commit SHA."; exit 1; }
          test -n "$SITE_URL" || { echo "::error::SITE_URL is not set for this environment."; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET_ENVIRONMENT}-${COMMIT}" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deploy access (docs/runbooks/hosting.md, "Deploy access"). With the
      # environment variable DEPLOY_MODE=isolated, this environment's own
      # user (qbbe-<environment>, its own key in DEPLOY_SSH_KEY) runs only the
      # root-owned release wrapper. Otherwise the old shared deploy user is
      # used, until both environments have been switched over.
      - name: Choose the deploy path
        id: path
        env:
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
          LEGACY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
        run: |
          case "${DEPLOY_MODE:-legacy}" in
            isolated) echo "user=qbbe-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"; echo "mode=isolated" >> "$GITHUB_OUTPUT" ;;
            legacy) echo "user=${LEGACY_USER}" >> "$GITHUB_OUTPUT"; echo "mode=legacy" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::DEPLOY_MODE must be 'isolated' or empty, not '${DEPLOY_MODE}'."; exit 1 ;;
          esac

      - uses: ./.github/actions/qbbe-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ steps.path.outputs.user }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Restore it
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ steps.path.outputs.mode }}
          RESTORE_SETTINGS: ${{ inputs.restore_settings && '1' || '0' }}
        shell: bash
        run: |
          set -o pipefail
          host="${SITE_URL#https://}"; host="${host%%/*}"
          dir="/opt/qbbe/${TARGET_ENVIRONMENT}"
          if [ "$RESTORE_SETTINGS" = 1 ]; then mode=restore; flag=--restore-settings; else mode=rollback; flag=; fi
          if [ "$DEPLOY_PATH" = isolated ]; then
            # Keeps the current settings; the wrapper checks this environment
            # was deployed before.
            printf '%s\n' "$REGISTRY_TOKEN" \
              | ssh qbbe "sudo -n /usr/local/sbin/qbbe-release '${TARGET_ENVIRONMENT}' '${mode}' '${IMAGE}' '${host}' '${REGISTRY_USER}'" \
              | tee release.log
            echo "Restored \`${IMAGE}\` on ${TARGET_ENVIRONMENT} (settings: $([ "$mode" = restore ] && echo "that release's" || echo current))." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ssh qbbe "test -f '${dir}/app.env'" || { echo "::error::${TARGET_ENVIRONMENT} has never been deployed on this server."; exit 1; }
          scp -q deploy/server/compose.app.yaml deploy/server/site.caddy.template deploy/server/release.sh "qbbe:${dir}/"
          printf '%s' "$REGISTRY_TOKEN" | ssh qbbe "
            export DOCKER_CONFIG='${dir}/.docker'
            docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin >/dev/null || exit 1
            bash '${dir}/release.sh' '${TARGET_ENVIRONMENT}' '${IMAGE}' '${host}' ${flag}; status=\$?
            docker logout ghcr.io >/dev/null 2>&1
            exit \$status" | tee release.log
          echo "Restored \`${IMAGE}\` on ${TARGET_ENVIRONMENT}." >> "$GITHUB_STEP_SUMMARY"

      - name: The restored site answers and runs that commit
        run: |
          code=none
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}/sign-in")
            [ "$code" = 200 ] && break
            sleep 6
          done
          [ "$code" = 200 ] || { echo "::error::${SITE_URL%/}/sign-in did not answer 200 after the restore (last: ${code})."; exit 1; }
          commit=$(curl -s "${SITE_URL%/}/api/health/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
          [ "$commit" = "$COMMIT" ] || { echo "::error::${SITE_URL%/} reports commit '${commit:-<none>}', not ${COMMIT}."; exit 1; }
          echo "${SITE_URL%/} answers and runs ${COMMIT}."
