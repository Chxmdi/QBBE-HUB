name: Nightly browsers

# The signed-in suites, including the accessibility and responsive matrix,
# in Chromium, Firefox and WebKit. Pull requests run Chromium only to keep
# them quick (decision recorded on #101, 2026-09-24); this catches what is
# specific to the other two within a day. Run it by hand before a release.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# No permissions by default: each job names the ones it uses.
permissions: {}

jobs:
  all-browsers:
    # What ci.yml's jobs use; a called workflow cannot hold more.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      browsers: chromium firefox webkit
      mobile: true
