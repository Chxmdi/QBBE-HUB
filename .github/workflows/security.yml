name: Security

# Static analysis, committed-secret detection and dependency review (#109).
# `npm audit` in ci.yml covers what is already installed; these cover the code
# itself, anything that looks like a credential, and vulnerable packages a
# pull request is about to add.

on:
  # Only pull requests into main. Workspace OS work is batched on
  # wos/integration (checked locally per PR) and tested here once, through
  # its pull request to main.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published CodeQL query or advisory reaches code that
    # has not changed.
    - cron: "0 5 * * 1"
  # Called by release-candidate.yml, so the candidate's evidence includes it.
  workflow_call:
  workflow_dispatch:

# A new push to a pull request replaces its previous run, so parallel work
# does not queue behind runs nobody will read. Pushes to main, deploys,
# nightly and release-candidate calls get a group of their own run, so they
# are never cancelled.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default: each job names the ones it uses.
permissions: {}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          # TypeScript needs no build for CodeQL to read it.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: "/language:javascript-typescript"

  secrets:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans the pull request's own commits, so it needs them.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
