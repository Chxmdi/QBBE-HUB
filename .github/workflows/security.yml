name: Security

# Static analysis, committed-secret detection and dependency review (#109).
# `npm audit` in ci.yml covers what is already installed; these cover the code
# itself, anything that looks like a credential, and vulnerable packages a
# pull request is about to add.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published CodeQL query or advisory reaches code that
    # has not changed.
    - cron: "0 5 * * 1"
  # Called by release-candidate.yml, so the candidate's evidence includes it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # TypeScript needs no build for CodeQL to read it.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  secrets:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the pull request's own commits, so it needs them.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
