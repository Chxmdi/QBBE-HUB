name: Deploy

# Publishes one exact commit of `main` to one QBBE environment on the QBBE
# server (#51, #52; docs/runbooks/hosting.md).
#
# Order, each step gating the next:
#   1. verify    every CI gate, re-run against this workflow's exact commit
#   2. evidence  production only: a green Release candidate run for the same
#                commit must exist, so production never gets a commit that was
#                not certified as a whole (all browsers, security, 50 users)
#   3. build     the environment's container image of this commit (the
#                server is ARM, so it is built on an ARM runner)
#   4. migrate   environment and isolation checks, a fresh backup (Backup
#                workflow) when there is anything to apply, then database
#                migrations. It waits for the build: the old image serves
#                the migrated database until the swap, so that window is
#                kept short, and a failed build changes nothing
#   5. release   the server swaps to the new image; a new container that does
#                not report healthy is replaced by the previous one again
#   5b.          a signed-in person can read data through the API (inside
#                the release job, so it needs no second environment approval)
#   6. smoke     the site answers, runs this commit, and its jobs are wired
#
# Migrations that drop or rename a table or column, or change a column's
# type, ship only after a release has stopped using it, and say which
# (`-- contract: safe-after <sha>`; tests/unit/migration-contract.test.ts).
#
# Rollback: .github/workflows/rollback.yml and
# docs/runbooks/release-procedure.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: QBBE environment to publish
        required: true
        default: staging
        type: choice
        options: [staging, production]

# No permissions by default: each job names the ones it uses.
permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Only main is published. Without this a run from another branch would
  # show every job skipped and look like nothing happened. The control that
  # holds even against an edited copy of this file is each environment's
  # "Deployment branches and tags" rule (main only; hosting.md).
  branch:
    permissions: {}
    name: Runs from main only
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Deploy publishes main only. Choose 'main' under 'Use workflow from' and run it again."
          exit 1

  verify:
    # ci.yml pulls the Supabase images from ghcr.io. A called workflow cannot
    # hold more than its caller grants, so without packages GitHub refuses
    # to start the run at all (startup_failure).
    permissions:
      contents: read
      packages: read
    # Re-run every gate against this workflow's exact commit, with no hosted secrets.
    uses: ./.github/workflows/ci.yml

  evidence:
    name: Release candidate evidence
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a green Release candidate run for this commit (production)
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-candidate.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" \
            --jq '.total_count')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful Release candidate run exists for ${GITHUB_SHA}."
            echo "Run the 'Release candidate' workflow on this commit, confirm it is green, then deploy again."
            exit 1
          fi
          echo "Release candidate evidence found for ${GITHUB_SHA}."
      - name: Staging needs only the gates above
        if: inputs.environment != 'production'
        run: echo "Staging deploys are gated by CI on ${GITHUB_SHA}."

  migrate:
    name: Environment checks, backup and migrations
    needs: [evidence, build]
    runs-on: ubuntu-latest
    # The backup can take most of this.
    timeout-minutes: 100
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Starts the Backup workflow and follows its run.
      actions: write
    env:
      # This environment's own database address (with its password), so the
      # job holds nothing that reaches another project. A Supabase personal
      # access token covers every project of the account (SEC-011).
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      # Also checks the app settings (APP_ENV): this environment's database,
      # its own address, the keys the app needs, and no Workspace OS switch
      # override on production.
      - name: Check environment readiness and isolation
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          # Repository-level variables, so each environment can check it is
          # not pointed at the other one's database.
          STAGING_SUPABASE_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: scripts/check-deploy-environment.sh

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.114.0

      # supabase/config.toml names a local-only signing key file (#138), and
      # `db push` refuses to run while that file is missing. This creates a
      # throwaway one on the runner so the config reads; `db push` only
      # applies migrations and sends nothing from this file to the project.
      - name: Local config's signing key
        run: scripts/local-signing-key.sh

      # `db push` refuses to run when the database holds a migration version
      # this commit does not have (drift), so an out-of-band change stops the
      # deploy here rather than being silently built on.
      - name: Migrations this deploy will apply (dry run)
        # Explicit bash adds pipefail, so a failed dry run fails this step
        # instead of being hidden by `tee`.
        shell: bash
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee migration-plan.txt
          {
            echo "### Migrations for ${{ inputs.environment }} at ${GITHUB_SHA}"
            echo '```'
            cat migration-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The only way to undo a migration is to restore a backup, so one is
      # taken right before migrating, by the Backup workflow (its own
      # environment and keys; docs/runbooks/backup-recovery.md). Nothing to
      # apply, nothing to back up. A failed or missing backup stops the
      # deploy before the database changes.
      - name: Back up the database right before migrating
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -qi "up to date" migration-plan.txt; then
            echo "No migrations to apply; no backup needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run backup.yml --ref main -f environment="$TARGET_ENVIRONMENT"
          run_id=""
          for _ in $(seq 1 24); do
            sleep 5
            run_id=$(gh run list --workflow backup.yml --branch main --event workflow_dispatch \
              --json databaseId,createdAt --limit 10 \
              --jq "[.[] | select(.createdAt >= \"${started}\")] | sort_by(.createdAt) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          [ -n "$run_id" ] || { echo "::error::The Backup workflow run did not start; no migration was applied."; exit 1; }
          echo "Backup run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --exit-status --interval 30 \
            || { echo "::error::The backup before migrating failed; no migration was applied. See the Backup run above."; exit 1; }

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Confirm nothing is left to apply
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run | tee after.txt
          grep -qi "up to date" after.txt || { echo "::error::Migrations still pending after push."; exit 1; }

  build:
    name: Build the image
    needs: evidence
    # The QBBE server is an ARM (Ampere) machine; build natively for it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Image name
        id: name
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET_ENVIRONMENT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Next.js writes NEXT_PUBLIC_* into the browser code at build time, so
      # they come from this environment's APP_ENV. They are public by design
      # (they ship to every browser); no server secret is a build argument.
      - name: Public build settings
        id: public
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          get() { printf '%s\n' "$APP_ENV" | tr -d '\r' | grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" | tail -n 1 | cut -d= -f2- | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"; }
          {
            echo "args<<QBBE_ARGS"
            for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_APP_URL NEXT_PUBLIC_GOOGLE_SIGN_IN; do
              echo "${name}=$(get "$name")"
            done
            echo "APP_COMMIT=${GITHUB_SHA}"
            echo "QBBE_ARGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: ${{ steps.public.outputs.args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=app-${{ inputs.environment }}

  release:
    name: Release on the server
    needs: [migrate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    outputs:
      previous: ${{ steps.release.outputs.previous }}
      site: ${{ steps.release.outputs.site }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ needs.build.outputs.image }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # Later steps run third-party code; it gets no token from .git/config.
          persist-credentials: false

      # Deploy access (docs/runbooks/hosting.md, "Deploy access"). With the
      # environment variable DEPLOY_MODE=isolated, this environment's own
      # user (qbbe-<environment>, its own key in DEPLOY_SSH_KEY) runs only the
      # root-owned release wrapper. Otherwise the old shared deploy user is
      # used, until both environments have been switched over.
      - name: Choose the deploy path
        id: path
        env:
          DEPLOY_MODE: ${{ vars.DEPLOY_MODE }}
          LEGACY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
        run: |
          case "${DEPLOY_MODE:-legacy}" in
            isolated) echo "user=qbbe-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"; echo "mode=isolated" >> "$GITHUB_OUTPUT" ;;
            legacy) echo "user=${LEGACY_USER}" >> "$GITHUB_OUTPUT"; echo "mode=legacy" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::DEPLOY_MODE must be 'isolated' or empty, not '${DEPLOY_MODE}'."; exit 1 ;;
          esac

      - uses: ./.github/actions/qbbe-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ steps.path.outputs.user }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # This environment's files only: the other environment's folder, its
      # container and its address are never written by this job.
      - name: Upload this release's files and settings
        if: steps.path.outputs.mode == 'legacy'
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          dir="/opt/qbbe/${TARGET_ENVIRONMENT}"
          ssh qbbe "test -d '$dir'" || { echo "::error::${dir} does not exist on the server. Run the 'Server setup' workflow first."; exit 1; }
          scp -q deploy/server/compose.app.yaml deploy/server/site.caddy.template deploy/server/release.sh "qbbe:${dir}/"
          printf '%s\n' "$APP_ENV" | tr -d '\r' | ssh qbbe "umask 077 && cat > '${dir}/app.env.new'"

      - name: Swap to the new image
        id: release
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          APP_ENV: ${{ secrets.APP_ENV }}
          DEPLOY_PATH: ${{ steps.path.outputs.mode }}
        shell: bash
        run: |
          set -o pipefail
          host="${SITE_URL#https://}"; host="${host%%/*}"
          dir="/opt/qbbe/${TARGET_ENVIRONMENT}"
          if [ "$DEPLOY_PATH" = isolated ]; then
            # The wrapper reads the registry token, then the settings, from
            # standard input; nothing is uploaded as a file.
            { printf '%s\n' "$REGISTRY_TOKEN"; printf '%s\n' "$APP_ENV" | tr -d '\r'; } \
              | ssh qbbe "sudo -n /usr/local/sbin/qbbe-release '${TARGET_ENVIRONMENT}' 'deploy' '${IMAGE}' '${host}' '${REGISTRY_USER}'" \
              | tee release.log
          else
          # The registry login lasts for this release only, in this
          # environment's own Docker config, and is removed afterwards.
          printf '%s' "$REGISTRY_TOKEN" | ssh qbbe "
            export DOCKER_CONFIG='${dir}/.docker'
            docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin >/dev/null || exit 1
            bash '${dir}/release.sh' '${TARGET_ENVIRONMENT}' '${IMAGE}' '${host}'; status=\$?
            docker logout ghcr.io >/dev/null 2>&1
            exit \$status" | tee release.log
          fi
          previous=$(sed -n 's/^ROLLBACK_TARGET=//p' release.log | tail -n 1)
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "site=${SITE_URL%/}" >> "$GITHUB_OUTPUT"
          {
            echo "Released \`${IMAGE}\` to ${TARGET_ENVIRONMENT} at ${SITE_URL}."
            echo
            echo "Rollback target (the image this replaced): \`${previous:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The public pages answering says nothing about the database: a project
      # missing its API grants deploys green, then sends every signed-in page
      # back to /sign-in. This signs in as the environment's smoke user
      # (lowest role, one test program; docs/runbooks/staging-provisioning.md)
      # and reads that person's own membership row. It runs third-party code
      # (the Supabase client), so the server key goes first and the check gets
      # only the public project address and key, never the rest of APP_ENV.
      - name: Remove the server key before running the check
        run: rm -f ~/.ssh/qbbe ~/.ssh/config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install the API client
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: A signed-in person can read data
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            message="Set the SMOKE_EMAIL variable and SMOKE_PASSWORD secret on the ${TARGET_ENVIRONMENT} environment (docs/runbooks/staging-provisioning.md, smoke user)."
            if [ "$TARGET_ENVIRONMENT" = production ]; then echo "::error::${message}"; exit 1; fi
            echo "::warning::Signed-in check skipped. ${message}"
            exit 0
          fi
          # The project address and its public key, from the same settings the
          # app was built with.
          get() { printf '%s\n' "$APP_ENV" | tr -d '\r' | grep -E "^[[:space:]]*(export[[:space:]]+)?$1=" | tail -n 1 | cut -d= -f2- | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"; }
          SUPABASE_URL=$(get NEXT_PUBLIC_SUPABASE_URL)
          SUPABASE_ANON_KEY=$(get NEXT_PUBLIC_SUPABASE_ANON_KEY)
          env -i PATH="$PATH" HOME="$HOME" SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            SMOKE_EMAIL="$SMOKE_EMAIL" SMOKE_PASSWORD="$SMOKE_PASSWORD" node scripts/ci/smoke-signed-in.mjs || {
            echo "::error::The signed-in check failed on ${SITE_URL}; the line above says why. 'could not sign in': check SMOKE_EMAIL and SMOKE_PASSWORD. 'permission denied': the database is missing its API grants (docs/runbooks/staging-provisioning.md). The image is live; roll back to ${PREVIOUS:-<see the summary above>} only if the cause is in this release."
            exit 1
          }

  smoke:
    permissions: {}
    name: Smoke check
    needs: release
    # Also after a failed signed-in check: the new image is live either way,
    # and these public checks say whether it serves.
    if: always() && needs.release.outputs.site != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads only the public address, so it needs no environment (and no
    # second approval where the environment requires one).
    env:
      SITE_URL: ${{ needs.release.outputs.site }}
      PREVIOUS: ${{ needs.release.outputs.previous }}
    steps:
      - name: The published site answers
        run: |
          test -n "$SITE_URL" || { echo "::error::SITE_URL is not set for this environment."; exit 1; }
          code=none
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}/sign-in")
            [ "$code" = 200 ] && { echo "${SITE_URL%/}/sign-in answered 200."; exit 0; }
            sleep 6
          done
          echo "::error::${SITE_URL%/}/sign-in did not answer 200 (last: ${code}). Roll back with the 'Rollback' workflow to ${PREVIOUS:-<see the Release summary>}."
          exit 1

      - name: The site runs this commit
        run: |
          commit=$(curl -s "${SITE_URL%/}/api/health/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::${SITE_URL%/} reports commit '${commit:-<none>}', not ${GITHUB_SHA}."; exit 1; }
          echo "${SITE_URL%/} runs ${GITHUB_SHA}."

      # A site whose background jobs are not wired looks healthy but never
      # scans an upload (so no file ever opens) and never sends a notification.
      # app.configure_job_runner is a one-time step per environment; this is
      # the check that it was done, for this site, with this site's secret.
      - name: Background jobs reach this site
        run: |
          body=$(curl -s "${SITE_URL%/}/api/health/jobs" || true)
          status=$(printf '%s' "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('jobRunner','unknown'))" 2>/dev/null || echo unknown)
          echo "Job runner: ${status}"
          case "$status" in
            ready) ;;
            not_configured|other_site|secret_mismatch)
              echo "::error::Background jobs are not wired to ${SITE_URL%/} (${status}). In this environment's Supabase SQL editor run: select app.configure_job_runner('${SITE_URL%/}', '<this environment's CRON_JOB_SECRET>'); then re-run this job. See docs/runbooks/jobs.md."
              exit 1 ;;
            app_secret_missing)
              echo "::error::The site has no CRON_JOB_SECRET. Add it to this environment's APP_ENV secret (32+ characters), deploy again, then run app.configure_job_runner with the same value."
              exit 1 ;;
            *)
              echo "::error::Could not read the job runner status from ${SITE_URL%/}/api/health/jobs (got: ${body:0:200})."
              exit 1 ;;
          esac
