name: CI

on:
  push:
    branches: [main]
  # Only pull requests into main. Workspace OS work is batched on
  # wos/integration (checked locally per PR) and tested here once, through
  # its pull request to main.
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      browsers:
        # Playwright projects for the signed-in suites. Pull requests and
        # deploys use Chromium; the nightly run passes all three (#101).
        description: Space-separated Playwright projects for signed-in checks
        type: string
        required: false
        default: chromium
      mobile:
        # Also run qa-matrix and the public routes on phone emulation
        # (Pixel 7, iPhone 14). Nightly only (#114).
        description: Run the phone-emulation projects too
        type: boolean
        required: false
        default: false

# A new push to a pull request replaces its previous run, so parallel work
# does not queue behind runs nobody will read. Pushes to main, deploys,
# nightly and release-candidate calls get a group of their own run, so they
# are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Pulling the Supabase service images from ghcr.io as an authenticated
  # caller rather than anonymously. See the login step in the database job.
  packages: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Reuse the previous build's cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; runtime values come from the host
          # environment. Never real secrets in CI config (ENV-003).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Reuse downloaded test browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility & responsive QA (public routes)
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/sign-in && break
            sleep 2
          done
          npx playwright test public-routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-failures
          path: test-results/
          retention-days: 7

  audit:
    # Its own job, so a failing browser check earlier in Verify can no longer
    # skip it (#51).
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      # Blocks on what the app ships. A development tool's advisory (the
      # linter's, the test runner's) cannot reach a person using the Hub, and
      # one with no released fix would otherwise hold every merge; the step
      # below still lists those, every severity, on each run.
      - name: Dependency audit (high+, shipped packages)
        run: npm audit --audit-level=high --omit=dev

      - name: All advisories, development tools included (reported, not blocking)
        if: always()
        run: |
          npm audit --audit-level=moderate > audit.txt 2>&1 || true
          {
            echo '### npm audit (all severities)'
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The database and signed-in browser checks used to run as one job that
  # took 40 minutes and gated every merge. They now run as parallel jobs, each
  # with its own throwaway local Supabase, and one final job keeps the
  # "Database security" name that branch protection requires (#199, W0-1).
  database-core:
    name: "Database security: RLS, advisor, realtime"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RLS allow/deny matrix
        run: npm run test:db

      - name: Database security advisor
        run: supabase db advisors --local --type security --fail-on error

      - name: Seed the workspace the realtime probe reads
        run: npm run db:seed

      - name: Realtime latency (p95 within 5 s)
        # 30 messages from one signed-in member to another over Realtime;
        # fails if any is lost or the 95th percentile exceeds 5 s (#113).
        run: npm run qa:realtime-latency

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  browsers:
    # Every signed-in spec runs: the list is built from the folder, so a new
    # feature's spec is picked up without editing this file. The specs are
    # split across four machines by measured time (scripts/ci/spec-groups.mjs),
    # keeping specs that read each other's records on one machine; qa-matrix,
    # the longest single file (WCAG 2.2 AA axe scans in both themes, a 6-width
    # x 2-theme overflow sweep, 200% zoom and keyboard paths across every
    # workspace route, #101), is split by test across three more. Playwright
    # still runs one worker per machine, so no two tests share a database.
    # Every part runs twice: once as production runs today (every Workspace
    # OS switch off) and once with every switch on (WORKSPACE_OS_FLAGS=all),
    # so a pull request cannot break either state. Tests that prove a screen
    # is hidden while its switch is off end their title with "[switch off]"
    # and are left out of the switches-on rows; tests that need the switches
    # end with "[switches on]" and are left out of the switches-off rows
    # (scripts/ci/switch-tests.mjs keeps the titles honest).
    name: "Database security: ${{ matrix.suite }} ${{ matrix.part }}/${{ matrix.parts }}${{ matrix.flags == 'all' && ' (switches on)' || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.browsers && inputs.browsers != 'chromium' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: signed-in, part: 1, parts: 4, flags: off }
          - { suite: signed-in, part: 2, parts: 4, flags: off }
          - { suite: signed-in, part: 3, parts: 4, flags: off }
          - { suite: signed-in, part: 4, parts: 4, flags: off }
          - { suite: qa-matrix, part: 1, parts: 3, flags: off }
          - { suite: qa-matrix, part: 2, parts: 3, flags: off }
          - { suite: qa-matrix, part: 3, parts: 3, flags: off }
          - { suite: signed-in, part: 1, parts: 4, flags: all }
          - { suite: signed-in, part: 2, parts: 4, flags: all }
          - { suite: signed-in, part: 3, parts: 4, flags: all }
          - { suite: signed-in, part: 4, parts: 4, flags: all }
          - { suite: qa-matrix, part: 1, parts: 3, flags: all }
          - { suite: qa-matrix, part: 2, parts: 3, flags: all }
          - { suite: qa-matrix, part: 3, parts: 3, flags: all }
    env:
      SIGNED_IN_BROWSERS: ${{ inputs.browsers || 'chromium' }}
      # Read by the build and by the running server (per request).
      WORKSPACE_OS_FLAGS: ${{ matrix.flags == 'all' && 'all' || '' }}
      # The tests each row leaves out (see the job comment).
      SWITCH_GREP_INVERT: ${{ matrix.flags == 'all' && '\[switch off\]' || '\[switches on\]' }}
      # A per-run value: the job routes and the specs that call them need the
      # same one, and nothing outside this runner ever sees it.
      CRON_JOB_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed the workspace the browser checks read
        # A migrated but empty workspace has no programmes or projects for
        # the access inventory to show. Same seeding path as
        # docs/runbooks/qa.md, so CI and a developer machine start alike.
        run: npm run db:seed

      - name: Reuse the previous build's cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build authenticated test app
        run: npm run build

      - name: Reuse downloaded test browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install authenticated test browsers
        # Only the browsers this run uses: installing all three pulls every
        # engine's system packages, which took 14 minutes on one runner.
        env:
          MOBILE: ${{ inputs.mobile && 'chromium webkit' || '' }}
        run: npx playwright install --with-deps $(echo $SIGNED_IN_BROWSERS $MOBILE | tr ' ' '\n' | sort -u)

      - name: Start the app
        run: |
          nohup npx next start -p 3000 -H 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          npx wait-on --timeout 60000 http-get://127.0.0.1:3000/sign-in

      - name: Signed-in lifecycle and access checks
        if: matrix.suite == 'signed-in'
        run: |
          SPECS=$(node scripts/ci/spec-groups.mjs ${{ matrix.part }} ${{ matrix.parts }})
          npx playwright test $SPECS --grep-invert "$SWITCH_GREP_INVERT" $(printf -- "--project=%s " $SIGNED_IN_BROWSERS)

      - name: Signed-in accessibility, responsive and keyboard matrix
        if: matrix.suite == 'qa-matrix'
        run: npx playwright test qa-matrix --fully-parallel --shard=${{ matrix.part }}/${{ matrix.parts }} --grep-invert "$SWITCH_GREP_INVERT" $(printf -- "--project=%s " $SIGNED_IN_BROWSERS)

      - name: Phone emulation (qa-matrix and public routes)
        if: matrix.suite == 'qa-matrix' && inputs.mobile
        run: npx playwright test qa-matrix public-routes --fully-parallel --shard=${{ matrix.part }}/${{ matrix.parts }} --project=mobile-chrome --project=mobile-safari

      - name: Show the app server log after a failure
        # Server-side errors behind a failed browser check, readable in the
        # job log without downloading the evidence artifact.
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/next.log" || true

      - name: Name the evidence after this part
        if: failure()
        id: evidence
        run: echo "name=authenticated-browser-failures-${{ matrix.suite }}-${{ strategy.job-index }}" >> "$GITHUB_OUTPUT"

      - name: Preserve authenticated failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: |
            test-results/
            ${{ runner.temp }}/next.log
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  database-security:
    # The check branch protection requires (scripts/protect-main.sh). It passes
    # only when every part above passed; a skipped, cancelled or failed part
    # fails it.
    name: Database security
    needs: [database-core, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every database and browser part passed
        env:
          CORE: ${{ needs.database-core.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          echo "Database, advisor and realtime: $CORE"
          echo "Signed-in browser parts: $BROWSERS"
          [ "$CORE" = success ] && [ "$BROWSERS" = success ] || { echo "::error::A database security part did not pass."; exit 1; }
