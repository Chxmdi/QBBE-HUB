name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  # Pulling the Supabase service images from ghcr.io as an authenticated
  # caller rather than anonymously. See the login step in the database job.
  packages: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; runtime values come from the host
          # environment. Never real secrets in CI config (ENV-003).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility & responsive QA (public routes)
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/sign-in && break
            sleep 2
          done
          npx playwright test public-routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-failures
          path: test-results/
          retention-days: 7

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Avoid local DB port collisions on CI runners
        run: |
          if lsof -iTCP:54322 -sTCP:LISTEN -t >/dev/null; then
            sed -i 's/^port = 54322$/port = 65432/' supabase/config.toml
          fi

      - name: Authenticate to ghcr.io before pulling service images
        # Anonymous pulls from ghcr.io draw on a shared allowance, and on
        # 2026-09-23 that allowance refused every image for three consecutive
        # attempts across three minutes — a database job failing on a registry.
        # An authenticated pull uses this repository's own allowance instead.
        # This token is issued to the workflow run and needs no secret to be
        # configured.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start migrated local database
        # `supabase start` pulls a dozen images, and a registry refusing them
        # fails this job before a single assertion runs. That happened four
        # times on 2026-09-23, during a GitHub incident, with the database job
        # reporting a registry problem as a database security failure.
        #
        # Three things are done about it.
        #
        # The services this job never uses are excluded, so their images are
        # not pulled at all: Studio is a web UI nothing here opens,
        # edge-runtime serves functions this project does not have, and
        # logflare, vector and supavisor are analytics and pooling. What stays
        # is what the checks below need — gotrue for sign-in, kong and
        # postgrest for the API, realtime for the revocation spec, storage-api
        # for uploads, mailpit for the recovery email, and postgres-meta for
        # the advisor.
        #
        # `supabase/setup-cli` pins SUPABASE_INTERNAL_IMAGE_REGISTRY to
        # ghcr.io, so every image comes from one registry and one registry's
        # bad day stops everything. The later attempts fall back to Docker Hub,
        # which publishes the same images.
        #
        # The retry then covers a transient refusal from either.
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" = 1 ]; then
              export SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
            fi
            echo "Attempt $attempt, pulling from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            if supabase start -x studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt via $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          echo "::error::supabase start failed three times across both registries"
          exit 1

      - name: RLS allow/deny matrix
        run: npm run test:db

      - name: Database security advisor
        run: supabase db advisors --local --type security --fail-on error

      - name: Configure synthetic local Auth for browser checks
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/supabase-status.json`, 'utf8'));
          if (!status.API_URL || !status.ANON_KEY) throw new Error('Local Supabase configuration missing');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}\nNEXT_PUBLIC_SUPABASE_ANON_KEY=${status.ANON_KEY}\n`);
          fs.unlinkSync(`${process.env.RUNNER_TEMP}/supabase-status.json`);
          NODE

      - name: Seed the workspace the browser checks read
        # The suite above rolls its fixtures back, as every database test
        # should. That leaves a migrated but empty workspace, and the access
        # inventory has programmes and projects to show only if some exist —
        # it used to read whatever rls.sql had committed. This is the same
        # seeding path docs/runbooks/qa.md documents for running these suites
        # locally, so CI and a developer machine now start from one fixture.
        run: npm run db:seed

      - name: Build authenticated test app
        run: npm run build

      - name: Install authenticated test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Authenticated lifecycle and access checks
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          npx wait-on --timeout 60000 http-get://127.0.0.1:3000/sign-in
          npx playwright test mfa realtime-revocation hello-hub access-impact my-work identity-lifecycle programs projects milestones task-core work-planning documents events --project=chromium

      - name: Signed-in accessibility, responsive and keyboard matrix
        # WCAG 2.2 AA axe scans in both themes, a 6-width x 2-theme overflow
        # sweep, 200% zoom and keyboard paths across every workspace route
        # (#101). It ran nowhere before this step existed. The server started
        # in the previous step is still listening.
        run: npx playwright test qa-matrix --project=chromium

      - name: Preserve authenticated failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-failures
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop
