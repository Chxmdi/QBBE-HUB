name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; runtime values come from the host
          # environment. Never real secrets in CI config (ENV-003).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility & responsive QA (public routes)
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/sign-in && break
            sleep 2
          done
          npx playwright test public-routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-failures
          path: test-results/
          retention-days: 7

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Avoid local DB port collisions on CI runners
        run: |
          if lsof -iTCP:54322 -sTCP:LISTEN -t >/dev/null; then
            sed -i 's/^port = 54322$/port = 65432/' supabase/config.toml
          fi

      - name: Start migrated local database
        # `supabase start` pulls a dozen images from ghcr.io, and a transient
        # `toomanyrequests` from the registry fails the whole job before a
        # single assertion has run — it did exactly that twice in a row on
        # 2026-09-23, on a change that touched no application code.
        #
        # Two things are done about it. The services this job never uses are
        # excluded, so their images are not pulled at all: Studio is a web UI
        # nothing here opens, edge-runtime serves functions this project does
        # not have, and logflare, vector and supavisor are analytics and
        # pooling. What stays is what the checks below actually need — gotrue
        # for sign-in, kong and postgrest for the API, realtime for the
        # revocation spec, storage-api for uploads, mailpit for the recovery
        # email, and postgres-meta for the advisor.
        #
        # The retry then covers the images that remain, because a registry
        # refusing a pull is not a reason to fail a run about database
        # security.
        run: |
          for attempt in 1 2 3; do
            if supabase start -x studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt; retrying"
            supabase stop --no-backup || true
            sleep $((attempt * 20))
          done
          echo "::error::supabase start failed three times; see the pull errors above"
          exit 1

      - name: RLS allow/deny matrix
        run: npm run test:db

      - name: Database security advisor
        run: supabase db advisors --local --type security --fail-on error

      - name: Configure synthetic local Auth for browser checks
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/supabase-status.json`, 'utf8'));
          if (!status.API_URL || !status.ANON_KEY) throw new Error('Local Supabase configuration missing');
          fs.appendFileSync(process.env.GITHUB_ENV,
            `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}\nNEXT_PUBLIC_SUPABASE_ANON_KEY=${status.ANON_KEY}\n`);
          fs.unlinkSync(`${process.env.RUNNER_TEMP}/supabase-status.json`);
          NODE

      - name: Seed the workspace the browser checks read
        # The suite above rolls its fixtures back, as every database test
        # should. That leaves a migrated but empty workspace, and the access
        # inventory has programmes and projects to show only if some exist —
        # it used to read whatever rls.sql had committed. This is the same
        # seeding path docs/runbooks/qa.md documents for running these suites
        # locally, so CI and a developer machine now start from one fixture.
        run: npm run db:seed

      - name: Build authenticated test app
        run: npm run build

      - name: Install authenticated test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Authenticated lifecycle and access checks
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          npx wait-on --timeout 60000 http-get://127.0.0.1:3000/sign-in
          npx playwright test mfa realtime-revocation hello-hub access-impact my-work identity-lifecycle programs projects milestones task-core work-planning documents --project=chromium

      - name: Preserve authenticated failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-failures
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop
