name: CI

on:
  push:
    branches: [main]
  # Only pull requests into main. Workspace OS work is batched on
  # wos/integration (checked locally per PR) and tested here once, through
  # its pull request to main.
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      browsers:
        # Playwright projects for the signed-in suites. Pull requests and
        # deploys use Chromium; the nightly run passes all three (#101).
        description: Space-separated Playwright projects for signed-in checks
        type: string
        required: false
        default: chromium
      mobile:
        # Also run qa-matrix and the public routes on phone emulation
        # (Pixel 7, iPhone 14). Nightly only (#114).
        description: Run the phone-emulation projects too
        type: boolean
        required: false
        default: false

# A new push to a pull request replaces its previous run, so parallel work
# does not queue behind runs nobody will read. Pushes to main, deploys,
# nightly and release-candidate calls get a group of their own run, so they
# are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests, with the coverage floors
        # Fails when an area's line coverage falls below its floor in
        # vitest.config.ts. The run took about 100 s and 4 GB locally.
        run: npm run test:coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Reuse the previous build's cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; runtime values come from the host
          # environment. Never real secrets in CI config (ENV-003).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Reuse downloaded test browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility & responsive QA (public routes)
        run: |
          npx next start -p 3000 -H 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/sign-in && break
            sleep 2
          done
          npx playwright test public-routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-browser-failures
          path: test-results/
          retention-days: 7

  audit:
    permissions:
      contents: read
    # Its own job, so a failing browser check earlier in Verify can no longer
    # skip it (#51).
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      # Blocks on what the app ships. A development tool's advisory (the
      # linter's, the test runner's) cannot reach a person using the Hub, and
      # one with no released fix would otherwise hold every merge; the step
      # below still lists those, every severity, on each run.
      - name: Dependency audit (high+, shipped packages)
        run: npm audit --audit-level=high --omit=dev

      - name: All advisories, development tools included (reported, not blocking)
        if: always()
        run: |
          npm audit --audit-level=moderate > audit.txt 2>&1 || true
          {
            echo '### npm audit (all severities)'
            echo '```'
            tail -n 40 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    permissions:
      contents: read
    # The container the QBBE server runs (docs/runbooks/hosting.md). Built
    # here, for this runner's processor, so a broken Dockerfile fails a pull
    # request instead of a deploy. Placeholder public values only.
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: qbbe-hub:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
            NEXT_PUBLIC_APP_URL=https://hub.example.org
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

      - name: The container starts healthy, read-only, and reports its commit
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges:true -p 3000:3000 \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder qbbe-hub:ci-${GITHUB_SHA}
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$state" = healthy ] && break
            [ "$state" = unhealthy ] && break
            sleep 3
          done
          docker logs app | tail -n 20
          [ "$state" = healthy ] || { echo "::error::The container did not become healthy (${state})."; exit 1; }
          commit=$(curl -fsS http://127.0.0.1:3000/api/health/version | python3 -c "import json,sys; print(json.load(sys.stdin)['commit'])")
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::The image reports commit '${commit}', not ${GITHUB_SHA}."; exit 1; }
          echo "The image starts healthy and reports ${commit}."

  # The database and signed-in browser checks used to run as one job that
  # took 40 minutes and gated every merge. They now run as parallel jobs, each
  # with its own throwaway local Supabase, and one final job keeps the
  # "Database security" name that branch protection requires (#199, W0-1).
  database-core:
    # Pulling the Supabase service images from ghcr.io as an authenticated
    # caller rather than anonymously. See the login step in local-supabase.
    permissions:
      contents: read
      packages: read
    name: "Database security: RLS, advisor, realtime"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/local-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: RLS allow/deny matrix
        run: npm run test:db

      # src/types/database.ts is generated from the schema these migrations
      # build; a migration committed without regenerating it fails here.
      - name: Database types match the migrations
        run: npm run db:types:check

      - name: Database security advisor
        run: supabase db advisors --local --type security --fail-on error

      - name: Seed the workspace the realtime probe reads
        run: npm run db:seed

      - name: Realtime latency (p95 within 5 s)
        # 30 messages from one signed-in member to another over Realtime;
        # fails if any is lost or the 95th percentile exceeds 5 s (#113).
        run: npm run qa:realtime-latency

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  browser-list:
    permissions: {}
    # The browsers input as a JSON list, so each browser can be a job of its
    # own below (GitHub expressions cannot split a string).
    name: Browser list
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      json: ${{ steps.list.outputs.json }}
    steps:
      - id: list
        env:
          BROWSERS: ${{ inputs.browsers || 'chromium' }}
        run: echo "json=$(printf '%s\n' $BROWSERS | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  browsers:
    # Pulling the Supabase service images from ghcr.io as an authenticated
    # caller rather than anonymously. See the login step in local-supabase.
    permissions:
      contents: read
      packages: read
    # Every signed-in spec runs: the list is built from the folder, so a new
    # feature's spec is picked up without editing this file. The specs are
    # split across four machines by measured time (scripts/ci/spec-groups.mjs),
    # keeping specs that read each other's records on one machine; qa-matrix,
    # the longest single file (WCAG 2.2 AA axe scans in both themes, a 6-width
    # x 2-theme overflow sweep, 200% zoom and keyboard paths across every
    # workspace route, #101), is split by test across three more. Playwright
    # still runs one worker per machine, so no two tests share a database.
    # Every part runs twice: once as production runs today (every Workspace
    # OS switch off) and once with every switch on (WORKSPACE_OS_FLAGS=all),
    # so a pull request cannot break either state. Tests that prove a screen
    # is hidden while its switch is off end their title with "[switch off]"
    # and are left out of the switches-on rows; tests that need the switches
    # end with "[switches on]" and are left out of the switches-off rows
    # (scripts/ci/switch-tests.mjs keeps the titles honest).
    name: "Database security: ${{ matrix.shard.suite }} ${{ matrix.shard.part }}/${{ matrix.shard.parts }}${{ matrix.flags == 'all' && ' (switches on)' || '' }}${{ matrix.browser != 'chromium' && format(' [{0}]', matrix.browser) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.browser != 'chromium' && 60 || 40 }}
    needs: browser-list
    strategy:
      fail-fast: false
      matrix:
        # Each browser is a job with a database of its own. Run one after
        # another on one database, a later browser met what an earlier one
        # left behind (an extra ledger period moved every fiscal year, leftover
        # tasks pushed a new one off the first page), so results depended on
        # the order rather than on the browser.
        browser: ${{ fromJSON(needs.browser-list.outputs.json) }}
        flags: [off, all]
        shard:
          - { suite: signed-in, part: 1, parts: 4 }
          - { suite: signed-in, part: 2, parts: 4 }
          - { suite: signed-in, part: 3, parts: 4 }
          - { suite: signed-in, part: 4, parts: 4 }
          - { suite: qa-matrix, part: 1, parts: 3 }
          - { suite: qa-matrix, part: 2, parts: 3 }
          - { suite: qa-matrix, part: 3, parts: 3 }
    env:
      SIGNED_IN_BROWSERS: ${{ matrix.browser }}
      # The address the browsers reach the app on. Cookies follow it: over
      # plain http they are not marked Secure, which Firefox and WebKit would
      # otherwise drop (the language choice, so French screens stayed English).
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # Read by the build and by the running server (per request).
      WORKSPACE_OS_FLAGS: ${{ matrix.flags == 'all' && 'all' || '' }}
      # The tests each row leaves out (see the job comment).
      SWITCH_GREP_INVERT: ${{ matrix.flags == 'all' && '\[switch off\]' || '\[switches on\]' }}
      # A per-run value: the job routes and the specs that call them need the
      # same one, and nothing outside this runner ever sees it.
      CRON_JOB_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make a Google token key for this run
        # The app seals Google tokens with GOOGLE_TOKEN_KEY (PRIV-011). A
        # fresh key per run, masked, never written down.
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::${key}"
          echo "GOOGLE_TOKEN_KEY=${key}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/local-supabase
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed the workspace the browser checks read
        # A migrated but empty workspace has no programmes or projects for
        # the access inventory to show. Same seeding path as
        # docs/runbooks/qa.md, so CI and a developer machine start alike.
        run: npm run db:seed

      - name: Reuse the previous build's cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build authenticated test app
        run: npm run build

      - name: Reuse downloaded test browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install authenticated test browsers
        # Only the browsers this run uses: installing all three pulls every
        # engine's system packages, which took 14 minutes on one runner.
        env:
          MOBILE: ${{ inputs.mobile && matrix.browser == 'chromium' && 'chromium webkit' || '' }}
        run: npx playwright install --with-deps $(echo $SIGNED_IN_BROWSERS $MOBILE | tr ' ' '\n' | sort -u)

      - name: Week of the virus signatures
        id: clamav-week
        if: matrix.shard.suite == 'signed-in' && matrix.browser == 'chromium'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Reuse downloaded virus signatures
        if: matrix.shard.suite == 'signed-in' && matrix.browser == 'chromium'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/clamav-db
          key: clamav-db-${{ steps.clamav-week.outputs.week }}
          restore-keys: clamav-db-

      - name: Start ClamAV for the upload and scan journey
        # Only the part that runs document-scan.spec.ts needs a scanner. The
        # signatures are cached for a week; freshclam only tops them up.
        if: matrix.shard.suite == 'signed-in' && matrix.browser == 'chromium'
        run: |
          node scripts/ci/spec-groups.mjs ${{ matrix.shard.part }} ${{ matrix.shard.parts }} 2>/dev/null | grep -q document-scan || exit 0
          mkdir -p ~/clamav-db && chmod 777 ~/clamav-db
          docker run -d --name clamav -p 3310:3310 -v ~/clamav-db:/var/lib/clamav clamav/clamav:stable
          for i in $(seq 1 60); do
            docker logs clamav 2>&1 | grep -q "socket found, clamd started" && break
            sleep 5
          done
          docker logs clamav 2>&1 | grep -q "socket found, clamd started" || { docker logs clamav | tail -20; exit 1; }
          echo "CLAMAV_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "QA_CLAMAV=1" >> "$GITHUB_ENV"

      - name: Start the app
        # Each server log line gets a UTC time so a browser check that failed on
        # the connection (its job-log line is timestamped) can be matched to what
        # the server was doing at that moment.
        run: |
          nohup bash -c 'npx next start -p 3000 -H 127.0.0.1 2>&1 | while IFS= read -r line; do printf "%s %s\n" "$(date -u +%H:%M:%S.%3N)" "$line"; done' > "$RUNNER_TEMP/next.log" 2>&1 &
          npx wait-on --timeout 60000 http-get://127.0.0.1:3000/sign-in

      - name: Signed-in lifecycle and access checks
        if: matrix.shard.suite == 'signed-in'
        run: |
          SPECS=$(node scripts/ci/spec-groups.mjs ${{ matrix.shard.part }} ${{ matrix.shard.parts }})
          npx playwright test $SPECS --grep-invert "$SWITCH_GREP_INVERT" $(printf -- "--project=%s " $SIGNED_IN_BROWSERS)

      - name: Signed-in accessibility, responsive and keyboard matrix
        if: matrix.shard.suite == 'qa-matrix'
        run: npx playwright test qa-matrix --fully-parallel --shard=${{ matrix.shard.part }}/${{ matrix.shard.parts }} --grep-invert "$SWITCH_GREP_INVERT" $(printf -- "--project=%s " $SIGNED_IN_BROWSERS)

      - name: Phone emulation (qa-matrix and public routes)
        if: matrix.shard.suite == 'qa-matrix' && inputs.mobile && matrix.browser == 'chromium'
        run: npx playwright test qa-matrix public-routes --fully-parallel --shard=${{ matrix.shard.part }}/${{ matrix.shard.parts }} --project=mobile-chrome --project=mobile-safari

      - name: Show the app server log after a failure
        # Server-side errors behind a failed browser check, readable in the
        # job log without downloading the evidence artifact.
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/next.log" || true

      - name: Name the evidence after this part
        if: failure()
        id: evidence
        run: echo "name=authenticated-browser-failures-${{ matrix.shard.suite }}-${{ matrix.browser }}-${{ strategy.job-index }}" >> "$GITHUB_OUTPUT"

      - name: Preserve authenticated failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: |
            test-results/
            ${{ runner.temp }}/next.log
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  database-security:
    permissions: {}
    # The check branch protection requires (scripts/protect-main.sh). It passes
    # only when every part above passed; a skipped, cancelled or failed part
    # fails it.
    name: Database security
    needs: [database-core, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every database and browser part passed
        env:
          CORE: ${{ needs.database-core.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          echo "Database, advisor and realtime: $CORE"
          echo "Signed-in browser parts: $BROWSERS"
          [ "$CORE" = success ] && [ "$BROWSERS" = success ] || { echo "::error::A database security part did not pass."; exit 1; }
