name: Deploy Netlify

# Publishes one exact commit of `main` to one QBBE environment (#51, #52).
#
# Order, each step gating the next:
#   1. verify    every CI gate, re-run against this workflow's exact commit
#   2. evidence  production only: a green Release candidate run for the same
#                commit must exist, so production never gets a commit that was
#                not certified as a whole (all browsers, security, 50 users)
#   3. migrate   environment and isolation checks, then database migrations
#   4. publish   the site, recording the deploy it replaces for rollback
#   5. smoke     the published site answers
#
# Rollback: .github/workflows/rollback-netlify.yml and
# docs/runbooks/release-procedure.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: QBBE environment to publish
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  # The verify job calls ci.yml, which pulls the Supabase images from ghcr.io.
  # A called workflow cannot hold more than its caller grants, so without this
  # GitHub refuses to start the run at all (startup_failure).
  packages: read

concurrency:
  group: netlify-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    # Re-run every gate against this workflow's exact commit, with no hosted secrets.
    uses: ./.github/workflows/ci.yml

  evidence:
    name: Release candidate evidence
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a green Release candidate run for this commit (production)
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-candidate.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" \
            --jq '.total_count')
          if [ "${runs:-0}" -lt 1 ]; then
            echo "::error::No successful Release candidate run exists for ${GITHUB_SHA}."
            echo "Run the 'Release candidate' workflow on this commit, confirm it is green, then deploy again."
            exit 1
          fi
          echo "Release candidate evidence found for ${GITHUB_SHA}."
      - name: Staging needs only the gates above
        if: inputs.environment != 'production'
        run: echo "Staging deploys are gated by CI on ${GITHUB_SHA}."

  migrate:
    name: Environment checks and migrations
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check environment readiness and isolation
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          # Repository-level variables, so each environment can check it is
          # not pointed at the other one's database.
          STAGING_SUPABASE_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: scripts/check-deploy-environment.sh

      - name: Confirm the site's runtime database is this environment's
        run: |
          url=$(npx --yes netlify-cli@27.5.0 env:get NEXT_PUBLIC_SUPABASE_URL \
            --context production --site "$NETLIFY_SITE_ID" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          case "$url" in
            "https://${SUPABASE_PROJECT_REF}.supabase.co"|"https://${SUPABASE_PROJECT_REF}.supabase.co/") ;;
            *) echo "::error::The Netlify site's NEXT_PUBLIC_SUPABASE_URL is not this environment's Supabase project (${SUPABASE_PROJECT_REF})."; exit 1 ;;
          esac
          echo "Site ${NETLIFY_SITE_ID} reads Supabase project ${SUPABASE_PROJECT_REF}."

      # WORKSPACE_OS_FLAGS turns unfinished Workspace OS modules on without
      # touching the feature_flag table (src/lib/feature-flags.ts). It is for
      # staging only; on production it would show unfinished screens to
      # everyone. Read the production site's variables the same way as the
      # database check above, and fail closed: a list that cannot be read
      # stops the deploy too.
      - name: Refuse Workspace OS switch overrides on production
        if: inputs.environment == 'production'
        run: |
          npx --yes netlify-cli@27.5.0 env:list --json \
            --context production --site "$NETLIFY_SITE_ID" > site-env.json 2>/dev/null \
            || { echo "::error::Could not read the production site's environment variables."; exit 1; }
          node -e '
            const vars = JSON.parse(require("fs").readFileSync("site-env.json", "utf8"));
            // Present at all counts, even empty or hidden as a secret value.
            if (!vars || typeof vars !== "object" || Object.hasOwn(vars, "WORKSPACE_OS_FLAGS")) {
              console.log("::error::WORKSPACE_OS_FLAGS is set on the production Netlify site (or its variables could not be read). Delete it (Site configuration > Environment variables) and deploy again.");
              process.exit(1);
            }
          ' || exit 1
          rm -f site-env.json
          echo "Production site ${NETLIFY_SITE_ID} has no WORKSPACE_OS_FLAGS override."

      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      # supabase/config.toml names a local-only signing key file (#138), and
      # `db push` refuses to run while that file is missing. This creates a
      # throwaway one on the runner so the config reads; `db push` only
      # applies migrations and sends nothing from this file to the project.
      - name: Local config's signing key
        run: scripts/local-signing-key.sh

      - name: Link the environment's database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # `db push` refuses to run when the database holds a migration version
      # this commit does not have (drift), so an out-of-band change stops the
      # deploy here rather than being silently built on.
      - name: Migrations this deploy will apply (dry run)
        # Explicit bash adds pipefail, so a failed dry run fails this step
        # instead of being hidden by `tee`.
        shell: bash
        run: |
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" | tee migration-plan.txt
          {
            echo "### Migrations for ${{ inputs.environment }} at ${GITHUB_SHA}"
            echo '```'
            cat migration-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm nothing is left to apply
        run: |
          supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD" | tee after.txt
          grep -qi "up to date" after.txt || { echo "::error::Migrations still pending after push."; exit 1; }

  publish:
    name: Publish
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    outputs:
      previous_deploy: ${{ steps.previous.outputs.id }}
    env:
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Record the deploy being replaced
        id: previous
        run: |
          id=$(curl -fsS -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            | python3 -c "import json,sys; print((json.load(sys.stdin).get('published_deploy') or {}).get('id',''))")
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "Rollback target (the ${{ inputs.environment }} deploy this replaces): \`${id:-none}\`" >> "$GITHUB_STEP_SUMMARY"

      # Each environment has a separate site. Its production context contains
      # that environment's build/runtime settings, including public Auth keys.
      - name: Build and publish to the selected QBBE site
        run: npx --yes netlify-cli@27.5.0 deploy --prod --context production --message "$GITHUB_SHA"

  smoke:
    name: Smoke check
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: The published site answers
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PREVIOUS: ${{ needs.publish.outputs.previous_deploy }}
        run: |
          test -n "$SITE_URL" || { echo "::error::SITE_URL is not set for this environment."; exit 1; }
          code=none
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}/sign-in")
            [ "$code" = 200 ] && { echo "${SITE_URL%/}/sign-in answered 200."; exit 0; }
            sleep 6
          done
          echo "::error::${SITE_URL%/}/sign-in did not answer 200 (last: ${code}). Roll back with the 'Rollback Netlify' workflow, deploy ${PREVIOUS:-<see the Publish summary>}."
          exit 1

      # A site whose background jobs are not wired looks healthy but never
      # scans an upload (so no file ever opens) and never sends a notification.
      # app.configure_job_runner is a one-time step per environment; this is
      # the check that it was done, for this site, with this site's secret.
      - name: Background jobs reach this site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          body=$(curl -s "${SITE_URL%/}/api/health/jobs" || true)
          status=$(printf '%s' "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('jobRunner','unknown'))" 2>/dev/null || echo unknown)
          echo "Job runner: ${status}"
          case "$status" in
            ready) ;;
            not_configured|other_site|secret_mismatch)
              echo "::error::Background jobs are not wired to ${SITE_URL%/} (${status}). In this environment's Supabase SQL editor run: select app.configure_job_runner('${SITE_URL%/}', '<this site's CRON_JOB_SECRET>'); then re-run this job. See docs/runbooks/jobs.md."
              exit 1 ;;
            app_secret_missing)
              echo "::error::The site has no CRON_JOB_SECRET. Set it in the Netlify site's environment settings (32+ characters), redeploy, then run app.configure_job_runner with the same value."
              exit 1 ;;
            *)
              echo "::error::Could not read the job runner status from ${SITE_URL%/}/api/health/jobs (got: ${body:0:200})."
              exit 1 ;;
          esac
